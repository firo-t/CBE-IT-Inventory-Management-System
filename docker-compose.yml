version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cbe_inventory_db
    environment:
      POSTGRES_USER: cbe_user
      POSTGRES_PASSWORD: cbe_password
      POSTGRES_DB: cbe_inventory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
